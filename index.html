<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Troika Foods</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#fff;
color:#202124;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

/* subtle background */
body::before{
content:"";
position:absolute;
width:450px;
height:450px;
background:#F3F8F3;
border-radius:50%;
top:-180px;
right:-150px;
filter:blur(10px);
}

body::after{
content:"";
position:absolute;
width:300px;
height:300px;
background:#FFF7EB;
border-radius:50%;
bottom:-120px;
left:-100px;
filter:blur(8px);
}

.container{
width:100%;
max-width:760px;
padding:40px;
text-align:center;
position:relative;
z-index:2;
}

/* Logo */

.logo{
width:72px;
height:72px;
margin:auto;
margin-bottom:24px;
border-radius:18px;
background:#F7F8F7;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
box-shadow:0 4px 20px rgba(0,0,0,.05);
}

h1{
font-size:3rem;
font-weight:700;
letter-spacing:-1px;
margin-bottom:12px;
}

.subtitle{
font-size:18px;
color:#5f6368;
margin-bottom:34px;
}

.description{
max-width:620px;
margin:auto;
font-size:17px;
line-height:1.8;
color:#5f6368;
}

.launch{
display:inline-block;
margin-top:40px;
padding:12px 28px;
border-radius:999px;
background:#1E8E3E;
color:white;
font-weight:600;
font-size:15px;
letter-spacing:.3px;
box-shadow:0 8px 24px rgba(30,142,62,.15);
transition:.25s;
}

.launch:hover{
transform:translateY(-2px);
box-shadow:0 12px 30px rgba(30,142,62,.2);
}

.footer{
margin-top:70px;
font-size:14px;
color:#80868B;
line-height:2;
}

.footer a{
color:#1E8E3E;
text-decoration:none;
}

/* Decorative Elements */

.leaf{
position:absolute;
font-size:28px;
opacity:.12;
animation:float 8s ease-in-out infinite;
}

.l1{top:12%;left:10%;}
.l2{top:18%;right:12%;animation-delay:2s;}
.l3{bottom:12%;left:14%;animation-delay:4s;}
.l4{bottom:10%;right:12%;animation-delay:1s;}

@keyframes float{

0%,100%{
transform:translateY(0px);
}

50%{
transform:translateY(-18px);
}

}

@media(max-width:700px){

.container{
padding:25px;
}

h1{
font-size:2.2rem;
}

.subtitle{
font-size:16px;
}

.description{
font-size:15px;
}

}

</style>

</head>

<body>

<div class="leaf l1">🌿</div>
<div class="leaf l2">✨</div>
<div class="leaf l3">🌾</div>
<div class="leaf l4">🌶️</div>

<div class="container">

<div class="logo">🌿</div>

<h1>Troika Foods</h1>

<div class="subtitle">
Premium Spices • Dates • Quality Foods
</div>

<div class="description">
We're building a thoughtfully curated collection of premium spices,
dates, and wholesome food products sourced with care and crafted for
every kitchen.
</div>

<div class="launch">
Launching Soon
</div>

<div class="footer">

Kerala, India

<br><br>

<a href="mailto:info@troikafoods.com">
info@troikafoods.com
</a>

&nbsp;&nbsp;•&nbsp;&nbsp;

<a href="tel:+917306525347">
+91 73065 25347
</a>

</div>

</div>

</body>
</html>
